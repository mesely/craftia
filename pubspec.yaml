name: usta
description: "Usta - find trusted local service providers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  phosphor_glyphs: ^2.1.2+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0E5C63"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png

flutter_native_splash:
  color: "#F6F5F2"
  image: assets/brand/splash_logo_teal.png
  android_12:
    color: "#F6F5F2"
    image: assets/brand/splash_logo_teal.png
